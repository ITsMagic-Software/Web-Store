name: Deploy Store

on:
  push:
    branches: [main]
    paths-ignore:
      - out/**
      - tools/secrets/**

permissions:
  contents: read

concurrency:
  group: store-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Upload to store server
        env:
          STORE_UPLOAD_SECRET: ${{ secrets.STORE_UPLOAD_SECRET }}
          STORE_UPLOAD_URL: ${{ vars.STORE_UPLOAD_URL }}
        run: python tools/deploy.py
